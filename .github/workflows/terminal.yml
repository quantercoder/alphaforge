name: terminal
# Trades the paper account after each close, refreshes quotes during market hours,
# and deploys the terminal to GitHub Pages. live.json decides the broker (sim by default).
on:
  schedule:
    - cron: "15 21 * * 1-5"       # trading run, after the US close (16:00 ET = 20:00/21:00 UTC)
    - cron: "*/30 13-20 * * 1-5"  # intraday quote refresh, no trading
  push:
    branches: [main]
    paths: ["site/**", "alphaforge/**", "live.json"]
  workflow_dispatch:
    inputs:
      trade:
        description: "Run the trading step (otherwise refresh quotes only)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: terminal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Trade or refresh
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPHAFORGE_CONFIRM_LIVE: ${{ vars.ALPHAFORGE_CONFIRM_LIVE }}
          ALPHAFORGE_KILL: ${{ vars.ALPHAFORGE_KILL }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ] || [ "${{ inputs.trade }}" = "true" ]; then
            python -m alphaforge.live
          else
            python -m alphaforge.live --quotes-only
          fi

      - name: Commit trading state
        run: |
          git config user.name "alphaforge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%F)"
            git pull --rebase -q && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
